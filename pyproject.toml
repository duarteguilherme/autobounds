[build-system]
requires = [
        "setuptools>=77.0.3",
        "wheel"
]
build-backend = "setuptools.build_meta"


# PEP 621 metadata so tools like `uv add` can manage dependencies
[project]
name = "autobounds"
dynamic = ["version"]
description = "AUTOBOUNDS — software for calculating causal inference bounds"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
authors = [
    { name = "Guilherme Duarte" },
    { name = "Dean Knox" },
    { name = "Jonathan Mummolo" },
    { name = "Ilya Shpitser" },
    { name = "Noam Finkelstein" }
]
dependencies = [
    "pandas",
    "networkx",
    "numpy",
    "pyscipopt",
    "sympy"
]

[project.optional-dependencies]
dev = ["pytest", "build"]
plot = ["matplotlib", "plotnine"]
inference = ["scipy", "statsmodels"]
symbolic = ["pycddlib>=3.0.2,<4"]

[project.urls]
Homepage = "https://github.com/duarteguilherme/autobounds"
"Bug Tracker" = "https://github.com/duarteguilherme/autobounds/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:\\[Errno 13\\] Permission denied\\.\\s+joblib will operate in serial mode:UserWarning",
]

[tool.setuptools.dynamic]
version = {attr = "autobounds._version.__version__"}
