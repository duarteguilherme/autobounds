[metadata]
name = autobounds
version = 0.0.2
author = Guilherme Duarte, Dean Knox, Jonathan Mummolo, Ilya Shpitser, Noam Finkelstein
author_email = gjardimduarte@gmail.com
description = AUTOBOUNDS — software for calculating causal inference bounds
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/duarteguilherme/autobounds
project_urls =
    Bug Tracker = https://github.com/duarteguilherme/autobounds/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
include_package_data = True
python_requires = >=3.8
install_requires =
    tqdm
    pandas
    networkx
    matplotlib
    numpy
    plotnine
    pyscipopt
    sympy
    scipy

[options.packages.find]
where =

