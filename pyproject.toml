[build-system]
requires = [
        "setuptools>=61",
        "wheel"
]
build-backend = "setuptools.build_meta"


# PEP 621 metadata so tools like `uv add` can manage dependencies
[project]
name = "autobounds"
version = "0.0.2"
description = "AUTOBOUNDS — software for calculating causal inference bounds"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
authors = [
    { name = "Guilherme Duarte" },
    { name = "Dean Knox" },
    { name = "Jonathan Mummolo" },
    { name = "Ilya Shpitser" },
    { name = "Noam Finkelstein" }
]
dependencies = [
    "tqdm",
    "pandas",
    "networkx",
    "matplotlib",
    "numpy",
    "plotnine",
    "pyscipopt",
    "sympy",
    "scipy"
]

[project.urls]
Homepage = "https://github.com/duarteguilherme/autobounds"
"Bug Tracker" = "https://github.com/duarteguilherme/autobounds/issues"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:\\[Errno 13\\] Permission denied\\.\\s+joblib will operate in serial mode:UserWarning",
    "ignore:This process \\(pid=.*\\) is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning",
]
