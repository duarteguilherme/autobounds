name: Installed wheel tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numerical:
    name: Numerical / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build frontend
        run: python -m pip install build
      - name: Build and test a clean wheel installation
        run: python ci/test_wheel.py

  symbolic:
    name: Symbolic / Linux / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install exact-arithmetic development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcdd-dev libgmp-dev
      - name: Install build frontend
        run: python -m pip install build
      - name: Build and test a clean installation with the symbolic extra
        run: python ci/test_wheel.py --symbolic
